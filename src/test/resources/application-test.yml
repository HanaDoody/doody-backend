spring:
  datasource:
    url: jdbc:h2:mem:doody-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        hbm2ddl:
          halt_on_error: true

cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket: ""
      public-base-url: ""
